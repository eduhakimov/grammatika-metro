<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammatika Metro</title>
<!-- eduhakimov-himoya -->
<meta name="author" content="Hakimov Bahtiyorjon Muzaffar o'g'li">

<link rel="license" href="https://github.com/eduhakimov/grammatika-metro/blob/main/LICENSE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a metro map. Each grammar section is a coloured line, each lesson a station;
   word roles keep one colour everywhere (subject blue, auxiliary amber, verb rose, not violet). */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --soft:#E2E7EE; --ink:#16212E; --mut:#566577; --rule:#D3DAE3;
  --gs:#1D5FD1; --ga:#A85400; --gv:#C22B4E; --gn:#5B3FC4;
  --ok:#157A49; --bad:#C2302F; --acc:#16212E;
  --disp:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --lc:#1E9E6A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151C; --card:#19212B; --soft:#232D39; --ink:#E9EEF3; --mut:#9BA9B8; --rule:#2D3945;
    --gs:#82B3FF; --ga:#FFB65E; --gv:#FF90A8; --gn:#BBA7FF;
    --ok:#52C790; --bad:#FF8078; --acc:#E9EEF3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151C; --card:#19212B; --soft:#232D39; --ink:#E9EEF3; --mut:#9BA9B8; --rule:#2D3945;
  --gs:#82B3FF; --ga:#FFB65E; --gv:#FF90A8; --gn:#BBA7FF;
  --ok:#52C790; --bad:#FF8078; --acc:#E9EEF3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(28px,4.6vw,46px);font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700}
p{margin:0}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gs);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:18px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font:800 18px var(--disp);text-decoration:none;white-space:nowrap}
.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);font:700 15px var(--mono)}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.nav a{padding:6px 11px;border-radius:8px;text-decoration:none;font-weight:500;font-size:14.5px;color:var(--mut);white-space:nowrap}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--card)}
.count{font:700 13px var(--mono);color:var(--mut);white-space:nowrap}
main{padding:28px 0 72px}

/* shared */
.eyebrow{font:700 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.lead{color:var(--mut);font-size:17px;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:var(--card)}
.btn.pri:hover{opacity:.88;background:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;background:var(--lc);color:#fff;font:700 12.5px var(--mono);padding:2px 8px;border-radius:6px}
.g{padding:1px 6px;border-radius:5px;font-weight:600}
.gs{color:var(--gs);background:color-mix(in srgb,var(--gs) 13%,transparent)}
.ga{color:var(--ga);background:color-mix(in srgb,var(--ga) 14%,transparent)}
.gv{color:var(--gv);background:color-mix(in srgb,var(--gv) 13%,transparent)}
.gn{color:var(--gn);background:color-mix(in srgb,var(--gn) 14%,transparent)}
.cap{color:var(--mut);font-size:14.5px}
.scroll{overflow-x:auto}
.page{display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center}
.hero-t{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.hero-act{display:flex;flex-wrap:wrap;gap:10px}
.prog{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lc);border-radius:99px;transition:width .4s}
.board{background:#0C1118;color:#EEF2F6;border-radius:18px;padding:22px 22px 16px;display:flex;flex-direction:column;gap:12px;min-height:290px;
  --gs:#82B3FF;--ga:#FFB65E;--gv:#FF90A8;--gn:#BBA7FF;--rule:#33404E;--mut:#93A2B2;--ink:#EEF2F6;--card:#0C1118;--soft:#1C2632}
.board-h{display:flex;justify-content:space-between;font:700 12px var(--mono);letter-spacing:.1em;color:#93A2B2;text-transform:uppercase}
.board-n{font:800 clamp(24px,3.4vw,34px) var(--disp);letter-spacing:-.01em}
.board-s{font:500 clamp(17px,2.2vw,21px)/1.9 var(--mono)}
.board-u{color:#93A2B2;font-size:14.5px}
.swap{animation:swap .45s ease}
@keyframes swap{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}

/* tools */
.tools{display:grid;gap:12px;margin-top:36px}
.tool{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.tool:hover{border-color:var(--ink)}
.tool b{font:700 17px var(--disp)}
.tool span{color:var(--mut);font-size:14px;line-height:1.4}

/* map */
.map{margin-top:40px;display:flex;flex-direction:column}
.map>h2{margin-bottom:6px}
.line{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:start;padding:18px 0;border-top:1px solid var(--rule)}
.line-h{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.line-h b{font:700 16.5px var(--disp)}
.line-h small{color:var(--mut);font-size:13px}
.sts{display:flex;flex-wrap:wrap;row-gap:16px}
.st{position:relative;width:138px;padding:29px 12px 0 0;text-decoration:none;font-size:13.5px;line-height:1.3;font-weight:500}
.st::before{content:"";position:absolute;left:0;right:0;top:8px;height:5px;background:var(--lc)}
.st:last-child::before{right:auto;width:12px}
.st::after{content:"";position:absolute;left:0;top:0;width:21px;height:21px;border-radius:50%;background:var(--card);border:5px solid var(--lc);font:700 11px/11px var(--body);color:#fff;text-align:center}
.st.done::after{content:"✓";background:var(--lc)}
.st:hover{color:var(--lc)}
.st small{display:block;color:var(--mut);font-weight:400;font-size:12px}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:18px;max-width:820px;margin:0 auto}
.back{font-size:14.5px;color:var(--mut);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--ink)}
.l-head{display:flex;flex-direction:column;gap:8px;padding-left:18px;border-left:6px solid var(--lc)}
.l-line{font:700 12.5px var(--mono);color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.blk{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.idea p{font-size:17.5px;line-height:1.65;max-width:66ch}
.idea b{background:color-mix(in srgb,var(--lc) 18%,transparent);padding:0 3px;border-radius:3px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:600;cursor:pointer;font-size:14.5px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--card)}
.fm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 16px var(--mono)}
.fm .g{padding:6px 11px;border-radius:8px}
.fm .o{color:var(--mut)}
.fm-ex{font:500 16px/1.9 var(--mono)}
.frows{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--rule);background:var(--bg);border-radius:99px;padding:4px 12px;font:500 14px var(--mono);cursor:default}
button.chip{cursor:pointer}
button.chip:hover,button.chip.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.uses{display:flex;flex-direction:column;gap:0}
.use{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--rule)}
.use:first-child{border-top:0;padding-top:0}
.use small{grid-column:1/-1;color:var(--mut);font-size:13.5px;font-weight:600}
.use .en{font:500 16px/1.9 var(--mono)}
.use .uz{grid-column:1/-1;color:var(--mut);font-size:14.5px}
.spk{border:1px solid var(--rule);background:var(--bg);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
.spk:hover{border-color:var(--ink)}
.spk svg{width:17px;height:17px}
.errs{display:flex;flex-direction:column;gap:12px}
.err{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:15.5px}
.err .x{color:var(--bad);font-weight:700}.err .v{color:var(--ok);font-weight:700}
.err .w{text-decoration:line-through;text-decoration-color:var(--bad);font-family:var(--mono);font-size:15px}
.err .r{font-family:var(--mono);font-size:15px;font-weight:700}
.err .y{grid-column:2;color:var(--mut);font-size:14px}
.tl{width:100%;height:auto;display:block;max-width:640px}
.tl text{font:600 13px var(--body);fill:var(--mut)}
.tl .lab{fill:var(--ink)}
.l-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* quiz */
.qz{display:flex;flex-direction:column;gap:14px}
.qz-top{display:flex;align-items:center;gap:12px;font:700 13px var(--mono);color:var(--mut)}
.qz-top .bar{flex:1}
.qq{font-size:19px;font-weight:600;line-height:1.5}
.qq .gap{display:inline-block;width:64px;border-bottom:3px solid var(--lc);vertical-align:baseline;height:1em;margin:0 3px}
.qhint{color:var(--mut);font-size:14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 15px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);cursor:pointer;font:500 16px var(--mono)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:700}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.inrow{display:flex;gap:8px;flex-wrap:wrap}
.inrow input{flex:1;min-width:180px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font:500 16px var(--mono)}
.words{display:flex;flex-wrap:wrap;gap:7px;min-height:46px;align-items:center}
.words.ans{border-bottom:2px dashed var(--rule);padding-bottom:10px}
.word{padding:8px 13px;border-radius:9px;border:1.5px solid var(--ink);background:var(--card);cursor:pointer;font:500 15.5px var(--mono)}
.word.used{visibility:hidden}
.fb{border-radius:10px;padding:12px 15px;font-size:15.5px;display:flex;flex-direction:column;gap:3px}
.fb.ok{background:color-mix(in srgb,var(--ok) 13%,transparent)}
.fb.bad{background:color-mix(in srgb,var(--bad) 11%,transparent)}
.fb b{font-size:16px}.fb.ok b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.fb code{font:700 15px var(--mono)}
.res{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.res .big{font:800 48px var(--disp);line-height:1}
.stars{font-size:26px;letter-spacing:4px;color:var(--ga)}
.rows{display:flex;flex-direction:column;gap:8px;width:100%}
.row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:14.5px}
.row .bar i{background:var(--lc)}
.row span:last-child{font:700 13px var(--mono);text-align:right}

/* tools pages */
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.ctl label{font-size:14px;color:var(--mut);font-weight:600}
.ctl select{padding:8px 10px;border-radius:9px;border:1.5px solid var(--ink);background:var(--card)}
.grid12{display:grid;grid-template-columns:110px repeat(3,minmax(210px,1fr));gap:8px;min-width:780px}
.grid12 .hd{font:700 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:6px 4px;align-self:center}
.cell{background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--lc);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.cell b{font:700 15.5px var(--disp)}
.cell .sen{font:500 14.5px/1.85 var(--mono)}
.cell a{font-size:13.5px;font-weight:600;margin-top:auto}
.cell-b{display:flex;justify-content:space-between;align-items:center;gap:8px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-direction:column;gap:8px}
.step h3{font-size:16.5px}
.step .opt{font:500 15px var(--body)}
.step .opt.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.outc{border-top:5px solid var(--lc)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--ink)}
.mode b{font:700 18px var(--disp)}
.mode span{color:var(--mut);font-size:14.5px}
.mode em{font:700 12.5px var(--mono);font-style:normal;color:var(--ok)}
.flash{display:flex;flex-direction:column;gap:14px;max-width:560px}
.flash .v1{font:800 40px var(--disp)}
.flash .inrow label{font:700 13px var(--mono);color:var(--mut);display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule)}
th{font:700 12.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
td:nth-child(-n+3){font-family:var(--mono);font-weight:500}


/* v2: focus, steps, visuals */
:root{--go:#0B7F8C}
.go{color:var(--go);background:color-mix(in srgb,var(--go) 13%,transparent)}
.board{--go:#5FD0DC}
.l-bar{position:sticky;top:56px;z-index:4;background:var(--bg);padding:10px 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--rule)}
.stepper{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.stepper button{display:flex;align-items:center;gap:7px;border:1.5px solid var(--rule);background:var(--card);border-radius:99px;padding:6px 13px 6px 7px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--mut)}
.stepper button i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);font:700 12px var(--mono);font-style:normal}
.stepper button.on{border-color:var(--lc);color:var(--ink)}
.stepper button.on i{background:var(--lc);color:#fff}
.stepper button.seen i{background:color-mix(in srgb,var(--lc) 30%,transparent)}
.stepper .all{margin-left:auto;padding:6px 12px;font-size:13px}
.focusbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.focusbar button{border:1.5px solid transparent;cursor:pointer;font-size:13px}
.focusbar button.on{border-color:currentColor}
.focusbar .fa{background:var(--soft);color:var(--ink);padding:1px 8px;border-radius:5px;font-weight:600}
[data-focus] .g{transition:opacity .25s,filter .25s}
[data-focus="s"] .g:not(.gs),[data-focus="a"] .g:not(.ga),[data-focus="v"] .g:not(.gv),[data-focus="n"] .g:not(.gn){opacity:.22;filter:grayscale(1)}
[data-focus="s"] .gs,[data-focus="a"] .ga,[data-focus="v"] .gv,[data-focus="n"] .gn{box-shadow:0 0 0 2px currentColor}
[data-focus] .focusbar .g{opacity:1!important;filter:none!important;box-shadow:none!important}
.stp{display:none;flex-direction:column;gap:18px}
.stp.cur,.lesson.showall .stp{display:flex}
.stp-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lesson.showall .stp-nav{display:none}
.an{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center}
.anb{animation:grow .8s ease-out both;transform-box:fill-box;transform-origin:left center}
.anf{animation:fadeup .5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fm .pl{color:var(--mut);font-style:normal;font-weight:700}
.fkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--mut)}
.fkey b{font-family:var(--mono);color:var(--gv)}
.errc{text-align:left;border:1.5px solid var(--rule);background:var(--bg);border-radius:12px;padding:13px 15px;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.errc:hover{border-color:var(--ink)}
.errc .w{font:500 15.5px var(--mono)}
.errc .x{color:var(--bad);font-weight:700;margin-right:8px}.errc .v{color:var(--ok);font-weight:700;margin-right:8px}
.errc .r{font:700 15.5px var(--mono)}
.errc .y{color:var(--mut);font-size:14px}
.errc .hint{font-size:13px;color:var(--mut);font-weight:600}
.errc:not(.open) .rv{display:none}
.errc.open .hint{display:none}
.errc.open .w{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--mut)}
.errc.open{border-color:var(--ok)}
.vis{display:flex;flex-direction:column;gap:10px}
.vis-t{font:700 12.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.sw{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;align-items:center;padding:13px 15px;border-radius:12px;background:var(--bg);border:1.5px solid var(--rule)}
.sw small{font:700 12.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.sw span{font:500 17px/1.9 var(--mono)}
.sw-a{align-self:center;font-size:22px;color:var(--lc);line-height:1;padding-left:20px}
.shift{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 12px;align-items:center}
.shift span{padding:8px 12px;border-radius:9px;background:var(--bg);border:1.5px solid var(--rule);font:500 15px var(--mono)}
.shift span.to{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,transparent);font-weight:700}
.shift i{font-style:normal;color:var(--lc);font-size:19px}
.sc{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 12px;align-items:center}
.sc b{font:700 15px var(--mono)}
.sc .scb{display:flex;align-items:center;gap:10px}
.sc .bar{flex:1;height:14px}
.sc .bar i{background:var(--lc)}
.sc small{color:var(--mut);font-size:13.5px;min-width:130px}
.sc .hl{color:var(--lc)}
.nest{border:2px solid var(--lc);border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--lc) 7%,transparent);display:flex;flex-direction:column;gap:10px}
.nest>div:first-child{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.nest b{font:800 22px var(--disp);color:var(--lc)}
.nest span{font-size:14.5px}
.train{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:flex-end;padding-bottom:12px}
.car{position:relative;display:flex;flex-direction:column;gap:3px;padding:9px 14px;border-radius:9px 9px 4px 4px;background:var(--lc);color:#fff;min-width:96px}
.car small{font-size:12px;opacity:.85;font-weight:600}
.car b{font:700 16px var(--mono)}
.car::before,.car::after{content:"";position:absolute;bottom:-9px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--card)}
.car::before{left:12px}.car::after{right:12px}
.car:first-child{border-radius:9px 22px 4px 4px;filter:brightness(.82)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fl{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:13px 14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--rule)}
.fl small{font-size:13.5px;color:var(--mut);font-weight:600}
.fl i{font-style:normal;color:var(--lc);line-height:1}
.fl b{font:700 16px var(--mono);background:color-mix(in srgb,var(--lc) 16%,transparent);padding:3px 9px;border-radius:7px}
.fl span{font:500 14px var(--mono);color:var(--mut)}
.flq{font:700 17px var(--disp)}
/* analyzer */
.an-in{display:flex;gap:8px;flex-wrap:wrap}
.an-in input{flex:1;min-width:220px;padding:13px 15px;border-radius:11px;border:1.5px solid var(--ink);background:var(--card);font:500 17px var(--mono)}
.an-s{font:500 clamp(18px,2.6vw,24px)/2 var(--mono)}
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.find{border-left:5px solid var(--lc);background:var(--card);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.find small{font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.find b{font:700 18px var(--disp)}
.find span{font-size:14.5px;color:var(--mut)}
.find a{font-size:14px;font-weight:600}
.find.main{grid-column:1/-1;background:color-mix(in srgb,var(--lc) 9%,var(--card))}
.find.main b{font-size:26px}
.tools{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--go:#5FD0DC}}
:root[data-theme="dark"]{--go:#5FD0DC}
@media (max-width:480px){.sw{grid-template-columns:1fr}.sc{grid-template-columns:1fr}.stepper .all{display:none}}

/* v3: memory */
.today{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.goal{width:100%;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
.goal .bar i{background:var(--ga)}
.wk{display:flex;gap:6px;align-items:flex-end;height:54px}
.wk div{width:26px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.wk i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--rule)}
.wk .met i{background:var(--lc)}
.wk span{font:700 10.5px var(--mono);color:var(--mut)}
.mn{font:700 16px var(--disp);border-left:4px solid var(--lc);padding:4px 0 4px 12px}
.idea .mn{font-size:17px;line-height:1.35}
.stp-in{display:flex;flex-direction:column;gap:18px}
.stp-in[hidden]{display:none}
.pre{border:2px dashed var(--lc)}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{background:var(--card);border:1px solid var(--rule);border-top:6px solid var(--lc);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;width:100%}
.ccard>small{font-size:13px;color:var(--mut);font-weight:600}
.ccard>b{font:800 21px var(--disp)}
.ccard .fm{font-size:14px;gap:6px}.ccard .fm .g{padding:4px 8px}
.ccard .fm-ex{font-size:14.5px}
.ccard .chip{font-size:12.5px;padding:2px 9px}
.ccard .cell-b{margin-top:auto}
.ccard a{font-size:14px;font-weight:600}
.btn.sm{padding:6px 12px;font-size:13.5px;border-width:1.5px}
.mode[disabled]{opacity:.55;cursor:not-allowed}
.nb{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/18px var(--mono);text-align:center}
.nb[hidden]{display:none}
.fb a{font-weight:600;font-size:14.5px}
.row a{font-weight:600}

/* v4: more roles + answer breakdown */
:root{--gp:#3C7A12;--gt:#A3248F}
.gp{color:var(--gp);background:color-mix(in srgb,var(--gp) 13%,transparent)}
.gt{color:var(--gt);background:color-mix(in srgb,var(--gt) 12%,transparent)}
.board{--gp:#A6DB7A;--gt:#F09AD9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gp:#A6DB7A;--gt:#F09AD9}}
:root[data-theme="dark"]{--gp:#A6DB7A;--gt:#F09AD9}
[data-focus="o"] .g:not(.go),[data-focus="p"] .g:not(.gp),[data-focus="t"] .g:not(.gt){opacity:.22;filter:grayscale(1)}
[data-focus="o"] .go,[data-focus="p"] .gp,[data-focus="t"] .gt{box-shadow:0 0 0 2px currentColor}
.brk{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--rule)}
.brk-r{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;align-items:center}
.brk-r small{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.brk-r.bad small{color:var(--bad)}.brk-r.ok small{color:var(--ok)}
.brk-r span{font:500 16px/2 var(--mono)}
.brk .legend{font-size:12px;opacity:.9}
@media (max-width:480px){.brk-r{grid-template-columns:1fr}}

/* v5: rule references */
.whyx{padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--bad) 12%,transparent)}
.rule{display:flex;flex-direction:column;gap:5px;align-items:flex-start;margin-top:8px;padding:11px 13px;border-radius:10px;background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--lc)}
.rule small{font:700 11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.rule b{font-size:15.5px!important;color:var(--ink)!important}
.rule s{text-decoration-color:var(--bad);color:var(--mut)}
.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,60%{background:color-mix(in srgb,var(--ga) 30%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--ga) 30%,transparent)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
.rl{margin:0;padding-left:18px;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
@media (max-width:860px){
  .hero,.det{grid-template-columns:1fr}
  .modes{grid-template-columns:1fr}
  .line{grid-template-columns:1fr}
}
@media (max-width:480px){
  .st{width:50%}
  .count{display:none}
  .row{grid-template-columns:110px 1fr 44px}
  .blk,.card{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

{id:"ps-vs-pc",line:"pres",t:"Present Simple yoki Continuous?",s:"Odatmi yoki hozirmi",
idea:"Bu ikki zamonni ajratish uchun o'zingizga bitta savol bering: <b>bu ish doim shundaymi yoki faqat hozir?</b> “U shifokor bo'lib ishlaydi” degani doimiy holat (Simple). “U hozir bemorni ko'ryapti” degani ayni lahza (Continuous). Simple rasmdagi albomga, Continuous jonli videoga o'xshaydi.",
use:[["Doimiy: Present Simple","{s:He} {v:works} in a hospital.","U kasalxonada ishlaydi."],["Hozir: Present Continuous","{s:He} {a:is} {v:working} now.","U hozir ishlayapti."],["Doim shunday","{s:It} {v:rains} a lot in autumn.","Kuzda ko'p yomg'ir yog'adi."],["Ayni paytda","{s:It} {a:is} {v:raining}. Take an umbrella.","Yomg'ir yog'yapti. Soyabon oling."]],
err:[["I am going to school every day.","I go to school every day.","Every day odat, Present Simple."],["Listen! She sings.","Listen! She is singing.","Listen! hozirni bildiradi."]],
ex:[["mc","She usually ___ coffee, but today she ___ tea.",["drinks / is drinking","is drinking / drinks","drinks / drinks"],0,"Usually odat, today vaqtinchalik."],
["mc","Be quiet! The children ___.",["sleep","are sleeping","sleeps"],1,"Ayni paytda uxlashyapti."],
["in","My father ___ (work) in a bank. It is his job.",["works"],"Doimiy ish: Present Simple."],
["in","I ___ (read) a very interesting book these days.",["am reading","'m reading"],"These days: vaqtinchalik jarayon."],
["mc","What ___ he ___? He is a doctor.",["is / doing","does / do","do / does"],1,"Kasb haqida doimiy savol: What does he do?"],
["mc","What ___ he ___? He is washing the car.",["is / doing","does / do","do / do"],0,"Hozir nima qilyapti: What is he doing?"]]},

{id:"pres-perfect",line:"pres",tk:"pp",t:"Present Perfect",s:"O'tmish bilan hozir orasidagi ko'prik",
idea:"Kalitingizni yo'qotdingiz. Qachon yo'qotganingiz muhim emas, muhimi <b>hozir uyga kira olmayapsiz</b>. Present Perfect aynan shu: ish o'tmishda bo'lgan, lekin <b>natijasi hozir ko'rinib turibdi</b>. U o'tmish bilan hozirni bog'laydigan ko'prik. Qoida: aniq vaqt (yesterday, in 2020) aytilsa, bu zamon ishlatilmaydi.",
f:{p:"S|a:have / has|v:V3",n:"S|a:have / has|n:not|v:V3",q:"a:Have / Has|S|v:V3|o:?"},
sig:["already","just","yet","ever","never","since","for","recently","so far"],
use:[["Natija hozir ko'rinib turibdi","{s:I} {a:have} {v:lost} my key.","Men kalitimni yo'qotdim (hozir yo'q)."],["Hayotiy tajriba: ever, never","{a:Have} {s:you} ever {v:been} to London?","Siz hech Londonda bo'lganmisiz?"],["Hozirgina tugagan: just","{s:She} {a:has} just {v:arrived}.","U hozirgina keldi."],["O'shandan beri davom etyapti: for, since","{s:We} {a:have} {v:lived} here for ten years.","Biz bu yerda o'n yildan beri yashaymiz."]],
err:[["I have seen him yesterday.","I saw him yesterday.","Aniq vaqt (yesterday) bo'lsa Past Simple."],["She have finished.","She has finished.","He, she, it bilan has."],["I have went there.","I have gone there.","Have dan keyin V3 (gone), V2 emas."]],
ex:[["mc","I ___ my homework. Here it is.",["finished already","have already finished","am finishing"],1,"Natija hozir bor: have + V3."],
["in","She ___ (never / be) to Paris.",["has never been","'s never been"],"Tajriba: has never been."],
["mc","We have lived here ___ 2015.",["for","since","ago"],1,"Boshlanish nuqtasi (2015) bilan since."],
["mc","Have you done your homework ___?",["already","yet","just"],1,"Savol va inkor oxirida yet."],
["in","They ___ (just / leave).",["have just left","'ve just left"],"Just: have just + V3."],
["ord","I have known him for five years","Men uni besh yildan beri taniyman."]]},

{id:"pres-perf-cont",line:"pres",tk:"ppc",t:"Present Perfect Continuous",s:"Qachondan beri davom etyapti",
idea:"Soat 3 da yomg'ir boshlandi, hozir soat 5 va u <b>hali ham yog'yapti</b>. Bu zamon ishning <b>qancha vaqtdan beri davom etayotganini</b> ko'rsatadi. Xuddi sekundomer kabi: bosganingizdan beri ishlayapti. Present Perfect natijaga, bu zamon esa jarayonning davomiyligiga urg'u beradi.",
f:{p:"S|a:have / has been|v:V-ing",n:"S|a:have / has|n:not|a:been|v:V-ing",q:"a:Have / Has|S|a:been|v:V-ing|o:?"},

err:[["I am waiting for two hours.","I have been waiting for two hours.","For two hours bo'lsa Perfect Continuous."],["I have been knowing him for years.","I have known him for years.","Know holat fe'li, -ing olmaydi."]],
ex:[["mc","She ___ for three hours. She needs a break.",["is studying","has been studying","studies"],1,"Qancha vaqtdan beri: has been + V-ing."],
["in","We ___ (wait) since 9 o'clock.",["have been waiting","'ve been waiting"],"Since 9: have been waiting."],
["mc","How long ___ you ___ here?",["are / working","have / been working","do / work"],1,"How long + have been + V-ing."],
["mc","Qaysi gap to'g'ri?",["I have been having this car for a year.","I have had this car for a year.","I am having this car for a year."],1,"Have (egalik) holat fe'li: have had."],
["ord","He has been playing football all day","U kun bo'yi futbol o'ynayapti."]]},

idea:"Kecha kinoga bordingiz. Bu ish <b>bo'ldi va tugadi</b>, qachon bo'lgani ham ma'lum. Past Simple fotosuratga o'xshaydi: o'tmishdagi bitta tugallangan lahza. To'g'ri fe'llarga <b>-ed</b> qo'shiladi (work → worked), noto'g'ri fe'llarning ikkinchi shakli esa yodlanadi (go → went).",

err:[["I didn't went there.","I didn't go there.","Did bor joyda fe'l V1 da turadi."],["Did you saw him?","Did you see him?","Savolda ham V1."],["She goed home.","She went home.","Go noto'g'ri fe'l: went."]],

["in","She ___ (not / call) me yesterday.",["did not call","didn't call"],"Inkor: did not + V1."],
["mc","___ you ___ the match last night?",["Did / watch","Did / watched","Do / watch"],0,"Did + V1."],
["in","I ___ (buy) a new phone two days ago.",["bought"],"Buy noto'g'ri fe'l: bought."],
["in","They ___ (be) at home last night.",["were"],"They bilan were."],

{id:"past-cont",line:"past",tk:"pastc",t:"Past Continuous",s:"O'sha payt davom etayotgan edi",

["mc","While we ___ dinner, the lights went out.",["had","were having","have"],1,"While + uzun jarayon."],
["mc","She was walking home when she ___ an old friend.",["was meeting","met","meets"],1,"Qisqa voqea Past Simple da."],
["in","It ___ (rain) all morning yesterday.",["was raining"],"It bilan was + raining."],
["ord","They were not listening to the teacher","Ular o'qituvchini tinglamayotgan edi."]]},

{id:"pp-vs-ps",line:"past",t:"Past Simple yoki Present Perfect?",s:"Eng ko'p adashtiriladigan juftlik",
idea:"Ikkalasi ham o'tmishdagi ish haqida. Farqi bitta savolda: <b>qachon bo'lgani aytilyaptimi?</b> Vaqt aniq bo'lsa (yesterday, last year, in 2019), bu <b>Past Simple</b>, chunki o'sha vaqt tugagan. Vaqt aytilmasa va natija hozir muhim bo'lsa, bu <b>Present Perfect</b>. Past Simple yopilgan quti, Present Perfect ochiq quti.",
use:[["Aniq vaqt bor: Past Simple","{s:I} {v:saw} that film last week.","Men u filmni o'tgan hafta ko'rdim."],["Vaqt aytilmagan, tajriba: Present Perfect","{s:I} {a:have} {v:seen} that film.","Men u filmni ko'rganman."],["Tugagan davr","{s:She} {v:lived} in Tashkent for two years.","U Toshkentda ikki yil yashagan (endi yashamaydi)."],["Hali davom etyapti","{s:She} {a:has} {v:lived} in Tashkent for two years.","U Toshkentda ikki yildan beri yashaydi."]],

["mc","I ___ my keys yesterday.",["lost","have lost","lose"],0,"Yesterday: Past Simple."],
["mc","___ you ever ___ sushi?",["Did / eat","Have / eaten","Do / eat"],1,"Ever bilan tajriba: Present Perfect."],
["in","He ___ (go) to London in 2018.",["went"],"In 2018: Past Simple."],

["mc","When ___ you ___ this car?",["have / bought","did / buy","do / buy"],1,"When bilan Past Simple."]]},

{id:"past-perfect",line:"past",tk:"pastp",t:"Past Perfect",s:"O'tmishdan oldingi o'tmish",
idea:"Ikki o'tgan ish bor va qaysi biri <b>oldin</b> bo'lganini ko'rsatmoqchisiz. “Bekatga yetib kelganimda, avtobus ketib bo'lgan edi.” Avval avtobus ketdi, keyin men keldim. Oldin bo'lgan ish Past Perfect da turadi. Buni <b>o'tmishga yana bir qadam orqaga chekinish</b> deb o'ylang.",
f:{p:"S|a:had|v:V3",n:"S|a:had|n:not|v:V3",q:"a:Had|S|v:V3|o:?"},
sig:["before","after","by the time","already","when","never ... before"],

["in","I was hungry because I ___ (not / eat) anything.",["had not eaten","hadn't eaten"],"Ochlikdan oldingi holat: had not eaten."],
["mc","After he ___ his homework, he played games.",["had done","has done","does"],0,"After + had + V3."],
["mc","She ___ the book before she saw the film.",["read","had read","has read"],1,"Filmdan oldin o'qigan: had read."],
["ord","They had already left when I called","Men qo'ng'iroq qilganimda ular allaqachon ketgan edi."]]},

{id:"past-perf-cont",line:"past",tk:"pastpc",t:"Past Perfect Continuous",s:"O'sha paytgacha qancha davom etgan",
idea:"“U kelganida, men <b>ikki soatdan beri kutayotgan edim</b>.” Bu zamon o'tmishdagi bir nuqtagacha ish qancha vaqt davom etganini aytadi. Present Perfect Continuous ning o'tmishdagi egizagi: faqat sekundomer hozir emas, o'tmishdagi bir paytda to'xtatilgan.",

["in","His eyes were red because he ___ (cry).",["had been crying"],"Sabab bo'lgan jarayon: had been crying."],
["mc","How long ___ you ___ there before you moved?",["had / been living","have / been living","were / living"],0,"Ko'chishdan oldingi davomiylik."],
["ord","We had been walking for hours before we found the village","Qishloqni topgunimizcha biz soatlab yurgan edik."]]},

f:{p:"S|a:will be|v:V-ing",n:"S|a:will|n:not|a:be|v:V-ing",q:"a:Will|S|a:be|v:V-ing|o:?"},
sig:["at this time tomorrow","at 5 o'clock tomorrow","this time next week","all day tomorrow"],
use:[["Kelajakdagi aniq paytda davom etadigan ish","{s:I} {a:will be} {v:flying} to Dubai at this time tomorrow.","Ertaga shu paytda men Dubayga uchayotgan bo'laman."],["Muloyim savol","{a:Will} {s:you} {a:be} {v:using} the car tonight?","Bugun kechqurun mashinadan foydalanasizmi?"]],
err:[["I will working at 5.","I will be working at 5.","Will dan keyin be kerak."]],
ex:[["mc","Don't call at 8. We ___ dinner.",["will have","will be having","have"],1,"Soat 8 da jarayon davom etayotgan bo'ladi."],
["in","At this time tomorrow she ___ (write) her exam.",["will be writing","'ll be writing"],"Will be + V-ing."],
["mc","This time next week I ___ on the beach.",["will lie","will be lying","am lying"],1,"Kelajakdagi lahzadagi jarayon."],
["ord","They will not be working at midnight","Ular yarim tunda ishlamayotgan bo'ladi."]]},

{id:"fut-perfect",line:"fut",tk:"fp",t:"Future Perfect va Perfect Continuous",s:"Muddatgacha tugab bo'ladi",
idea:"Siz “Soat 6 gacha uy vazifamni tugatib bo'laman” deysiz. Kelajakda bir <b>muddat</b> bor va shu muddatgacha ish <b>tugallangan bo'ladi</b>. Kalit so'z: <b>by</b> (...gacha). Agar muddatgacha ish qancha vaqt davom etganini aytmoqchi bo'lsak, Future Perfect Continuous ishlatiladi: “Iyunda men bu yerda besh yildan beri ishlayotgan bo'laman.”",
f:{p:"S|a:will have|v:V3",n:"S|a:will|n:not|a:have|v:V3",q:"a:Will|S|a:have|v:V3|o:?"},
sig:["by 6 o'clock","by tomorrow","by next year","by the time","by then"],
use:[["Muddatgacha tugaydi (Future Perfect)","{s:I} {a:will have} {v:finished} by 6.","Men 6 gacha tugatib bo'laman."],["Muddatgacha davomiylik (Future Perfect Continuous)","By June {s:I} {a:will have been} {v:working} here for five years.","Iyunga kelib men bu yerda besh yildan beri ishlayotgan bo'laman."],["By the time dan keyin Present Simple","By the time you {v:come}, {s:we} {a:will have} {v:eaten}.","Siz kelguningizcha biz ovqatlanib bo'lamiz."]],
err:[["I will finish by 6 (tugallanganlikni ta'kidlash).","I will have finished by 6.","By + muddat: will have + V3."],["By next year I will have been knowing her for ten years.","By next year I will have known her for ten years.","Know holat fe'li."]],
ex:[["mc","By 2030 they ___ the new bridge.",["will build","will have built","are building"],1,"By 2030: will have + V3."],
["in","She ___ (leave) by the time you arrive.",["will have left","'ll have left"],"Siz kelguningizcha ketib bo'ladi."],
["mc","By next month I ___ here for two years.",["will work","will have been working","am working"],1,"Muddatgacha davomiylik."],
["mc","By the time he ___, we will have finished.",["will come","comes","came"],1,"By the time dan keyin Present Simple."],
["ord","We will have finished the project by Friday","Biz loyihani juma kunigacha tugatib bo'lamiz."]]},

/* ---------- M5 MODAL FE'LLAR ---------- */
{id:"can-could",line:"modal",t:"Can, could, be able to",s:"Qo'limdan keladi",
idea:"Modal fe'llar asosiy fe'lning yoniga kelib, unga <b>qo'shimcha ma'no</b> beradigan yordamchilar. <b>Can</b> “qila olaman” degani. Uchta oltin qoida barcha modallar uchun bir xil: ulardan keyin fe'l <b>to siz va -s siz</b> keladi, savolda o'zlari oldinga chiqadi, inkorda not qo'shiladi.",
f:{p:"S|a:can / could|v:V1",n:"S|a:cannot / could not|v:V1",q:"a:Can / Could|S|v:V1|o:?"},
use:[["Hozirgi qobiliyat","{s:I} {a:can} {v:swim}.","Men suza olaman."],["O'tmishdagi qobiliyat","{s:She} {a:could} {v:read} at four.","U to'rt yoshida o'qiy olardi."],["Ruxsat va muloyim iltimos","{a:Could} {s:you} {v:open} the window, please?","Derazani ochib yubora olasizmi?"],["Boshqa zamonlarda be able to","{s:I} {a:will be able to} {v:come} tomorrow.","Ertaga kela olaman."]],
err:[["He cans drive.","He can drive.","Modalga -s qo'shilmaydi."],["I can to swim.","I can swim.","Can dan keyin to yo'q."],["I will can come.","I will be able to come.","Will bilan can birga kelmaydi."]],
ex:[["mc","She ___ speak three languages.",["cans","can","can to"],1,"Can o'zgarmaydi."],
["mc","When I was five, I ___ ride a bike.",["can","could","am able"],1,"O'tmishdagi qobiliyat: could."],
["in","I ___ (not / can) find my keys. Where are they?",["cannot","can't","can not"],"Inkor: cannot / can't."],
["mc","Next year I ___ drive.",["will can","will be able to","can to"],1,"Kelajakda: will be able to."],
["ord","Could you help me with my homework?","Uy vazifamga yordam bera olasizmi?"]]},

{id:"must-have-to",line:"modal",t:"Must va have to",s:"Majburiyat va taqiq",
idea:"<b>Must</b> ichingizdan chiqqan majburiyat: “Men ko'proq o'qishim kerak”. <b>Have to</b> tashqaridan kelgan qoida: “Maktabda forma kiyishim kerak”. Eng muhim tuzoq inkorda: <b>mustn't</b> “mumkin emas, taqiq” degani, <b>don't have to</b> esa “shart emas, xohlasang qil” degani.",
f:{p:"S|a:must / have to|v:V1",n:"S|a:must not  yoki  do not have to|v:V1",q:"a:Do / Does|S|a:have to|v:V1|o:?"},
use:[["Shaxsiy majburiyat","{s:I} {a:must} {v:call} my mother.","Onamga qo'ng'iroq qilishim kerak."],["Tashqi qoida","{s:She} {a:has to} {v:wear} a uniform.","U forma kiyishi kerak."],["Taqiq","{s:You} {a:must not} {v:smoke} here.","Bu yerda chekish mumkin emas."],["Shart emas","{s:You} {a:do not have to} {v:come} early.","Erta kelishingiz shart emas."],["O'tgan zamonda ikkalasi ham had to","{s:I} {a:had to} {v:work} yesterday.","Kecha ishlashimga to'g'ri keldi."]],
err:[["You don't have to park here (taqiq).","You mustn't park here.","Taqiq uchun mustn't."],["I must went.","I had to go.","Must ning o'tgan zamoni: had to."]],
ex:[["mc","You ___ touch that wire. It's dangerous!",["don't have to","mustn't","haven't to"],1,"Taqiq: mustn't."],
["mc","Tomorrow is Sunday. I ___ get up early.",["mustn't","don't have to","must"],1,"Shart emas: don't have to."],
["in","She ___ (have to) work on Saturdays. It's a rule.",["has to"],"She bilan has to."],
["mc","I ___ go to the doctor yesterday.",["must","had to","have to"],1,"O'tgan zamon: had to."],
["ord","Do we have to wear a uniform?","Biz forma kiyishimiz kerakmi?"]]},

{id:"should",line:"modal",t:"Should, ought to, had better",s:"Maslahat berish",
idea:"Do'stingiz yo'talyapti va siz unga “Shifokorga borganing ma'qul” deysiz. Bu buyruq emas, <b>do'stona maslahat</b>. Buning uchun <b>should</b> ishlatiladi. <b>Ought to</b> xuddi shu ma'noda, biroz rasmiyroq. <b>Had better</b> kuchliroq: “shunday qilganing yaxshi, aks holda yomon bo'ladi”.",
f:{p:"S|a:should|v:V1",n:"S|a:should|n:not|v:V1",q:"a:Should|S|v:V1|o:?"},
use:[["Maslahat","{s:You} {a:should} {v:see} a doctor.","Shifokorga ko'rinishingiz kerak."],["Bunday qilmagan ma'qul","{s:You} {a:should} {n:not} {v:eat} so much sugar.","Bunchalik ko'p shakar yemasligingiz kerak."],["Kuchli ogohlantirish","{s:You} {a:had better} {v:hurry}.","Shoshilganingiz ma'qul."],["O'tmishdagi afsus: should have + V3","{s:I} {a:should have} {v:studied} more.","Ko'proq o'qishim kerak edi."]],
err:[["You should to rest.","You should rest.","Should dan keyin to yo'q."],["You had better to go.","You had better go.","Had better + V1."]],
ex:[["mc","You look tired. You ___ go to bed.",["should","shouldn't","must not"],0,"Maslahat: should."],
["mc","You ___ drive so fast. It's dangerous.",["should","shouldn't","had better"],1,"Qilmaslik maslahati."],
["in","It's late. We had better ___ (go) home.",["go"],"Had better + V1."],
["mc","I failed the test. I ___ harder.",["should study","should have studied","should studied"],1,"O'tmishdagi afsus."],
["ord","What should I do?","Men nima qilishim kerak?"]]},

{id:"may-might",line:"modal",t:"May, might, must be, can't be",s:"Ehtimol va xulosa",
idea:"Ba'zan biz aniq bilmaymiz, faqat taxmin qilamiz. Buni <b>ishonch shkalasi</b> deb tasavvur qiling. 100 foiz aminman: <b>must be</b> (“u albatta uyda”). Balki: <b>may / might</b> (“u uyda bo'lishi mumkin”). Bo'lishi mumkin emas: <b>can't be</b> (“u uyda bo'lishi mumkin emas”).",
f:{p:"S|a:may / might|v:V1",n:"S|a:may / might|n:not|v:V1"},
use:[["Ehtimol (taxminan 50 foiz)","{s:It} {a:might} {v:rain} later.","Keyinroq yomg'ir yog'ishi mumkin."],["Aniq xulosa","{s:He} {a:must} {v:be} tired. He worked all night.","U charchagan bo'lsa kerak."],["Mumkin emas degan xulosa","{s:She} {a:can't} {v:be} at home. Her car is not here.","U uyda bo'lishi mumkin emas."],["Rasmiy ruxsat","{a:May} {s:I} {v:come} in?","Kirsam maylimi?"]],
err:[["He mustn't be at home (xulosa).","He can't be at home.","Inkor xulosa uchun can't be."],["It may to snow.","It may snow.","May dan keyin to yo'q."]],
ex:[["mc","Take an umbrella. It ___ rain.",["must","might","can't"],1,"Aniq emas: might."],
["mc","She has three cars. She ___ be rich.",["might","must","can't"],1,"Kuchli dalil: must be."],
["mc","He ___ be hungry. He has just eaten.",["must","may","can't"],2,"Mumkin emas: can't be."],
["in","I'm not sure. I ___ (may) go to the party.",["may"],"May + V1."],
["ord","May I use your phone?","Telefoningizdan foydalansam maylimi?"]]},

/* ---------- M6 MAJHUL NISBAT ---------- */
{id:"passive-basic",line:"pass",t:"Passive Voice asoslari",s:"Kim qilgani muhim emas",
idea:"“Derazani kimdir sindirdi” va “Deraza sindirildi”. Ikkinchi gapda kim sindirgani aytilmaydi, chunki <b>muhimi deraza</b>. Passive da ish-harakat <b>kimning ustida bajarilgani</b> gap boshiga chiqadi. Formula juda oddiy: kerakli zamondagi <b>be</b> va fe'lning <b>uchinchi shakli (V3)</b>. Kim qilganini aytmoqchi bo'lsak, <b>by</b> qo'shamiz.",
f:{p:"o:Narsa|a:am / is / are (was / were)|v:V3|o:(by kim)",n:"o:Narsa|a:be|n:not|v:V3",q:"a:Be|o:narsa|v:V3|o:?"},
use:[["Active: kim qildi","{s:Tom} {v:cleans} the room every day.","Tom xonani har kuni tozalaydi."],["Passive: nima qilinadi","The room {a:is} {v:cleaned} every day.","Xona har kuni tozalanadi."],["O'tgan zamon","This house {a:was} {v:built} in 1990.","Bu uy 1990 yilda qurilgan."],["Kim qilgani: by","The book {a:was} {v:written} by Navoi.","Kitob Navoiy tomonidan yozilgan."]],
err:[["The letter was wrote yesterday.","The letter was written yesterday.","Be dan keyin V3."],["English speaks all over the world.","English is spoken all over the world.","Tilni kimdir gapiradi: passive kerak."]],
ex:[["mc","English ___ in many countries.",["speaks","is spoken","is speaking"],1,"Til gapiriladi: is + V3."],
["in","The window ___ (break) last night.",["was broken"],"O'tgan zamon passive: was + V3."],
["mc","These cars ___ in Asaka.",["are made","is made","make"],0,"Cars ko'plik: are made."],
["mc","“Hamlet” was written ___ Shakespeare.",["with","by","from"],1,"Bajaruvchi by bilan."],
["ord","The room is not cleaned every day","Xona har kuni tozalanmaydi."]]},

{id:"passive-tenses",line:"pass",t:"Passive barcha zamonlarda",s:"Faqat be o'zgaradi",
idea:"Passive ni har qanday zamonga qo'yish uchun yangi qoida yodlash shart emas. <b>V3 doim joyida turadi</b>, faqat <b>be</b> fe'li zamonga qarab kiyimini almashtiradi: is, was, will be, has been, is being. Be qaysi zamonda bo'lsa, butun gap o'sha zamonda.",
use:[["Present Simple","The letters {a:are} {v:sent} every day.","Xatlar har kuni jo'natiladi."],["Present Continuous","The road {a:is being} {v:repaired} now.","Yo'l hozir ta'mirlanyapti."],["Present Perfect","The work {a:has been} {v:done}.","Ish bajarib bo'lingan."],["Future","The results {a:will be} {v:announced} tomorrow.","Natijalar ertaga e'lon qilinadi."],["Modal bilan","It {a:must be} {v:finished} today.","U bugun tugatilishi kerak."]],
err:[["The bridge is building now.","The bridge is being built now.","Continuous passive: is being + V3."],["The work has done.","The work has been done.","Perfect passive: has been + V3."]],
ex:[["mc","A new school ___ in our town next year.",["will build","will be built","is built"],1,"Kelajak passive: will be + V3."],
["mc","My car ___ at the moment.",["is repaired","is being repaired","repairs"],1,"Ayni paytda: is being + V3."],
["in","The email ___ (already / send).",["has already been sent"],"Perfect passive: has been + V3."],
["mc","Homework ___ on time.",["must do","must be done","must done"],1,"Modal + be + V3."],
["mc","The thief ___ by the police yesterday.",["caught","was caught","has been caught"],1,"Yesterday: was + V3."]]},

/* ---------- M7 SHART GAPLAR ---------- */
{id:"cond-0-1",line:"cond",t:"Zero va First Conditional",s:"Haqiqiy shartlar",
idea:"Shart gap ikki bo'lakdan iborat: <b>agar</b> qismi (if) va <b>natija</b> qismi. <b>Zero</b>: doim shunday bo'ladi, xuddi tabiat qonuni kabi (“Muzni isitsang, eriydi”). <b>First</b>: kelajakda bo'lishi mumkin bo'lgan haqiqiy holat (“Yomg'ir yog'sa, uyda qolaman”). Oltin qoida: <b>if dan keyin hech qachon will qo'yilmaydi</b>.",
f:{p:"a:If|S|v:Present Simple|o:,|S|a:will|v:V1",n:"a:Zero: If|S|v:Present Simple|o:,|S|v:Present Simple"},
use:[["Zero: doimiy haqiqat","If you {v:heat} ice, it {v:melts}.","Muzni isitsangiz, eriydi."],["First: haqiqiy kelajak","If it {v:rains}, {s:I} {a:will} {v:stay} at home.","Yomg'ir yog'sa, uyda qolaman."],["Unless = if not","Unless you {v:hurry}, {s:you} {a:will} {v:miss} the bus.","Shoshilmasangiz, avtobusga kech qolasiz."],["When, as soon as, before, after dan keyin ham will yo'q","I {a:will} {v:call} you when I {v:arrive}.","Yetib borganimda sizga qo'ng'iroq qilaman."]],
err:[["If it will rain, I will stay home.","If it rains, I will stay home.","If dan keyin will yo'q."],["When I will see him, I will tell him.","When I see him, I will tell him.","When dan keyin ham Present Simple."]],
ex:[["mc","If you ___ hard, you will pass the exam.",["will study","study","studied"],1,"If + Present Simple."],
["mc","If you mix red and white, you ___ pink.",["get","will got","would get"],0,"Doimiy haqiqat: Zero."],
["in","If she ___ (come), we will go to the park.",["comes"],"If + Present Simple, she bilan -s."],
["mc","I will phone you as soon as I ___ home.",["will get","get","got"],1,"As soon as dan keyin Present Simple."],
["ord","If it is sunny, we will go to the beach","Havo ochiq bo'lsa, biz plyajga boramiz."]]},

{id:"cond-2",line:"cond",t:"Second Conditional",s:"Xayoliy hozir",
idea:"“Agar millioner bo'lganimda, dunyoni aylanardim.” Lekin siz millioner emassiz. Bu <b>hozir haqida xayol</b>, real emas. Inglizcha bu xayolni ko'rsatish uchun <b>zamonni bir qadam orqaga suradi</b>: if qismida Past Simple, natijada would. Qiziq qoida: barcha shaxslar bilan <b>were</b> ishlatiladi (If I were you).",
f:{p:"a:If|S|v:Past Simple|o:,|S|a:would|v:V1"},
use:[["Hozirgi noreal holat","If {s:I} {v:had} a car, {s:I} {a:would} {v:drive} to work.","Mashinam bo'lganida, ishga mashinada borardim."],["Maslahat: If I were you","If {s:I} {v:were} you, {s:I} {a:would} {v:accept} the job.","Sizning o'rningizda bo'lganimda, ishni qabul qilardim."],["Xayoliy savol","What {a:would} {s:you} {v:do} if you {v:won} a million?","Million yutsangiz nima qilardingiz?"]],
err:[["If I would have money, I would buy it.","If I had money, I would buy it.","If qismida would bo'lmaydi."],["If I was you, I would go.","If I were you, I would go.","Xayoliy shartda were."]],
ex:[["mc","If I ___ rich, I would travel the world.",["am","were","would be"],1,"Xayoliy holat: were."],
["mc","If she had more time, she ___ a language.",["will learn","would learn","learned"],1,"Natija: would + V1."],
["in","If I ___ (know) his number, I would call him.",["knew"],"If + Past Simple."],
["mc","What would you do if you ___ a ghost?",["see","saw","will see"],1,"If + Past Simple."],
["ord","If I were you, I would not do that","Sizning o'rningizda bo'lganimda, bunday qilmasdim."]]},

{id:"cond-3",line:"cond",t:"Third Conditional",s:"O'tmishdagi afsus",
idea:"“Agar erta turganimda, poyezdga ulgurardim.” Lekin turmadingiz va ulgurmadingiz. Hammasi <b>o'tmishda qolgan, o'zgartirib bo'lmaydi</b>. Yana bir qadam orqaga suramiz: if qismida Past Perfect, natijada would have va V3. Zinapoya kabi eslab qoling: First (present), Second (past), Third (past perfect).",
f:{p:"a:If|S|a:had|v:V3|o:,|S|a:would have|v:V3"},
use:[["O'tmishdagi noreal holat","If {s:I} {a:had} {v:studied}, {s:I} {a:would have} {v:passed}.","O'qiganimda, o'tgan bo'lardim."],["Inkor shaklda","If {s:she} {a:hadn't} {v:helped} me, {s:I} {a:would have} {v:failed}.","U yordam bermaganida, yiqilgan bo'lardim."],["Mixed: o'tmish sababi, hozirgi natija","If {s:I} {a:had} {v:slept} well, {s:I} {a:would} {v:feel} better now.","Yaxshi uxlaganimda, hozir o'zimni yaxshi his qilardim."]],
err:[["If I would have known, I would have come.","If I had known, I would have come.","If qismida would yo'q."],["If I had saw him, I would have told him.","If I had seen him, I would have told him.","Had dan keyin V3."]],
ex:[["mc","If you ___ me, I would have helped you.",["asked","had asked","would ask"],1,"If + Past Perfect."],
["mc","If we had left earlier, we ___ the train.",["would catch","would have caught","caught"],1,"Would have + V3."],
["in","If it ___ (not / rain), we would have gone out.",["had not rained","hadn't rained"],"If + had not + V3."],
["mc","Qaysi gap o'tmishdagi afsusni bildiradi?",["If I see him, I will tell him.","If I saw him, I would tell him.","If I had seen him, I would have told him."],2,"Third Conditional o'tmish haqida."],
["ord","If I had known, I would have called you","Bilganimda, sizga qo'ng'iroq qilgan bo'lardim."]]},

{id:"wish",line:"cond",t:"I wish / If only",s:"Qaniydi",
idea:"<b>I wish</b> “qaniydi” degani. U ham xayol haqida, shuning uchun zamon yana bir qadam orqaga suriladi. Hozirgi holatdan norozi bo'lsangiz, <b>Past Simple</b>. O'tmishdagi ishdan afsuslansangiz, <b>Past Perfect</b>. Birovning odati jahlingizni chiqarsa, <b>would</b>.",
f:{p:"S|a:wish|S|v:Past Simple / Past Perfect / would V1"},
use:[["Hozir haqida","{s:I} {a:wish} I {v:had} more time.","Qaniydi ko'proq vaqtim bo'lsa."],["O'tmish haqida afsus","{s:I} {a:wish} I {a:had} {v:studied} harder.","Qaniydi yaxshiroq o'qigan bo'lsam."],["Birovning odatidan norozilik","{s:I} {a:wish} you {a:would} {v:stop} talking.","Qaniydi gapirishni to'xtatsangiz."],["If only kuchliroq","If only {s:I} {v:were} taller!","Qaniydi bo'yim balandroq bo'lsa!"]],
err:[["I wish I have a car.","I wish I had a car.","Hozir haqida: Past Simple."],["I wish I didn't say that yesterday.","I wish I hadn't said that yesterday.","O'tmish haqida: Past Perfect."]],
ex:[["mc","I wish I ___ speak Chinese.",["can","could","will"],1,"Hozirgi xayol: could."],
["mc","I wish I ___ so much last night.",["didn't eat","hadn't eaten","don't eat"],1,"O'tmish afsusi: Past Perfect."],
["in","I wish it ___ (be) summer now.",["were","was"],"Hozir haqida: were."],
["mc","I wish you ___ so loudly. I'm trying to sleep.",["don't sing","wouldn't sing","hadn't sung"],1,"Odatdan norozilik: would."],
["ord","I wish I lived near the sea","Qaniydi dengiz yaqinida yashasam."]]},

/* ---------- M8 O'ZLASHTIRMA GAP ---------- */
{id:"rep-statements",line:"rep",t:"Reported Speech: darak gaplar",s:"Birovning gapini yetkazish",
idea:"Ali sizga “Men charchadim” dedi. Keyin siz boshqa odamga aytasiz: “Ali charchaganini aytdi”. Birovning gapini yetkazganingizda <b>zamon bir qadam orqaga suriladi</b>, chunki u gap endi o'tmishda aytilgan. Olmoshlar va vaqt so'zlari ham o'zgaradi: I → he, today → that day, here → there.",
f:{p:"S|a:said (that)|S|v:zamon bir qadam orqaga"},
use:[["Present Simple → Past Simple","“I am tired.” → He said (that) he {v:was} tired.","U charchaganini aytdi."],["Present Continuous → Past Continuous","“I am working.” → She said she {a:was} {v:working}.","U ishlayotganini aytdi."],["Past Simple / Present Perfect → Past Perfect","“I saw him.” → He said he {a:had} {v:seen} him.","U uni ko'rganini aytdi."],["will → would, can → could","“I will help.” → She said she {a:would} {v:help}.","U yordam berishini aytdi."],["say va tell farqi","He {v:told} me that... / He {v:said} that...","Tell dan keyin albatta kimga aytilgani keladi."]],
err:[["He said me that he was busy.","He told me that he was busy.","Said dan keyin me qo'yilmaydi."],["She said she will come.","She said she would come.","Will → would."]],
ex:[["mc","“I live in Andijan.” → He said he ___ in Andijan.",["lives","lived","has lived"],1,"Present Simple → Past Simple."],
["mc","“I will call you.” → She said she ___ call me.",["will","would","can"],1,"Will → would."],
["mc","He ___ me that he was tired.",["said","told","spoke"],1,"Kimga aytilgani bor: told."],
["in","“I can swim.” → She said she ___ swim.",["could"],"Can → could."],

idea:"Bog'lovchilar gaplar orasidagi <b>yo'l belgilari</b>: ular keyingi fikr qaysi tomonga burilishini ko'rsatadi. Qo'shish: <b>and</b>. Qarama-qarshi: <b>but, although, however</b>. Sabab: <b>because</b>. Natija: <b>so</b>. Maqsad: <b>to, so that</b>. Belgini to'g'ri tanlasangiz, tinglovchi adashmaydi.",
f:{p:"a:because|o:+ sabab     |a:so|o:+ natija",n:"a:although|o:+ gap     |a:despite / in spite of|o:+ ot yoki V-ing",q:"a:however|o:yangi gap boshida, vergul bilan"},

err:[["Although it was late, but we continued.","Although it was late, we continued.","Although va but birga kelmaydi."],["Despite it was raining, we played.","Although it was raining, we played.","Despite dan keyin gap emas, ot keladi."],["Because of I was ill, I stayed home.","Because I was ill, I stayed home.","Because of dan keyin ot keladi."]],

["mc","___ he is rich, he is not happy.",["Because","Although","Despite"],1,"Zidlik + gap: although."],
["mc","We didn't go out ___ the rain.",["because","because of","although"],1,"Ot oldidan: because of."],
["mc","___ the bad weather, the match continued.",["Although","Despite","However"],1,"Ot oldidan: despite."],

["ord","Although she was tired, she finished the work","Charchagan bo'lsa ham, u ishni tugatdi."]]}
);

function colorTail(ws,nextVerb,pv){
  const r=[];let st="o";
  for(let i=0;i<ws.length;i++){
    const w=ws[i],n=ws[i+1]||"",n2=ws[i+2]||"";
    const ts=/^(yesterday|today|tomorrow|now|tonight|soon|later|recently|lately|yet|then)$/.test(w)||(/^(every|last|next|this|these|all|each)$/.test(w)&&TN.test(n))||(w==="right"&&n==="now")||(/^(in|on|at|for|since|during|until|by|before|after)$/.test(w)&&(/^\d/.test(n)||TN.test(n)||(/^(the|a|an|my)$/.test(n)&&TN.test(n2))||(NUMW.test(n)&&TN.test(n2))))||(NUMW.test(w)&&(n2==="ago"||n==="ago"))||w==="ago";
    if(ts)st="t";
    else if(STOPW.has(w))break;
    else if(w==="to"&&(i===ws.length-1?nextVerb:VBASE.test(n))){r[i]=null;continue}
    else if(w==="to"&&/^(listen|talk|speak|spoke|writ|wrote|belong|explain|said|say|give|gave|sen[dt])/.test(pv||"")){}
    else if(st!=="t"&&(PPREP.has(w)||/^(here|there|home|abroad|upstairs|downstairs)$/.test(w)))st="p";
    if(st==="o"&&(/^(very|much|well|hard|fast|too|also|again|always|usually|often|never|just|already|still|not|please|ever|sometimes|out|up|down|off|away|back)$/.test(w)||(/ly$/.test(w)&&w.length>4))){r[i]=null;continue}
    r[i]=st;
  }
  return r;
}
function tailHtml(text){
  const tk=text.match(/[A-Za-z']+|\d[\d:]*|[^A-Za-z\d']+/g)||[],wi=[];let stop=tk.length;
  for(let i=0;i<tk.length;i++){if(/^[A-Za-z'\d]/.test(tk[i]))wi.push(i);else if(/[,;:.?!()“”→\/]/.test(tk[i])){stop=i;break}}
  const idx=wi.filter(i=>i<stop),rs=colorTail(idx.map(i=>tk[i].toLowerCase()),false),role={};
  idx.forEach((i,k)=>{if(rs[k])role[i]=rs[k]});
  let h="",i=0;
  while(i<tk.length){
    if(role[i]){let j=i;while(j+2<tk.length&&role[j+2]===role[i]&&/^\s+$/.test(tk[j+1]))j+=2;h+=`<span class="g g${role[i]}">${tk.slice(i,j+1).join("")}</span>`;i=j+1}
    else h+=tk[i++];
  }
  return h;
}

/* ---------- conjugator ---------- */
function conj(tk,s,v,form){
  const third=/^(He|She|It)$/.test(s),I=s==="I";
  const be=I?"am":third?"is":"are",was=I||third?"was":"were",have=third?"has":"have";
  let aux,main;
  const M={pc:[[be],v.ing],pp:[[have],v.pp],ppc:[[have,"been"],v.ing],pastc:[[was],v.ing],pastp:[["had"],v.pp],pastpc:[["had","been"],v.ing],
    fs:[["will"],v.b],fc:[["will","be"],v.ing],fp:[["will","have"],v.pp],fpc:[["will","have","been"],v.ing]};
  if(tk==="ps"){ if(form==="p"){aux=[];main=third?v.s:v.b}else{aux=[third?"does":"do"];main=v.b} }
  else if(tk==="pasts"){ if(form==="p"){aux=[];main=v.p}else{aux=["did"];main=v.b} }
  else [aux,main]=M[tk];
  let t=[];
  if(form==="q"){
    const a0=aux[0];t.push(["a",a0[0].toUpperCase()+a0.slice(1)],["s",I?"I":s.toLowerCase()]);
    aux.slice(1).forEach(a=>t.push(["a",a]));
  }else{
    t.push(["s",s]);
    aux.forEach((a,i)=>{t.push(["a",a]);if(form==="n"&&i===0)t.push(["n","not"])});
  }
  t.push(["v",main],["o",v.r]);
  const end=form==="q"?"?":".";
  return {html:t.map(([k,x])=>k==="o"?tailHtml(x):`<span class="g g${k}">${x}</span>`).join(" ")+end,text:t.map(x=>x[1]).join(" ")+end};
}

    if(k==="rep"){for(let i=0;i<7;i++)s+=`<circle class="an" ${dl()} cx="${X(a+(b-a)*i/6)}" cy="${Y}" r="7" fill="var(--lc)"/>`;s+=`<text class="lab anf" ${dl()} x="${(X(a)+X(b))/2}" y="28" text-anchor="middle">${c}</text>`}
    if(k==="link")s+=`<g class="anf" ${dl()}><path d="M${X(a)} ${Y+12} Q${(X(a)+X(b))/2} ${Y+42} ${X(b)-4} ${Y+8}" fill="none" stroke="var(--lc)" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M${X(b)-13} ${Y+9} l9 -1 -3 9" fill="none" stroke="var(--lc)" stroke-width="2.5" stroke-linecap="round"/><text class="lab" x="${(X(a)+X(b))/2-6}" y="${Y+40}" text-anchor="middle">${c}</text></g>`;

function quiz(host,list,done,opt={}){

      if(/^\(/.test(fill))return null;
      const g=(it.q.match(/___/g)||[]).length,ps=fill.split(" / ");
      if(ps.length===g){let k=0;s=it.q.replace(/___/g,()=>ps[k++])}else if(g===1)s=it.q.replace("___",fill);else return null;
    }else if(/\s/.test(fill)&&/[.?!]$/.test(fill))s=fill;else return null;

    $(".qz-fb",host).innerHTML=`<div class="fb ${ok?"ok":"bad"} anf"><b>${ok?"To'g'ri!":"Xato"}</b>${ok?"":`<span>To'g'ri javob: <code>${right}</code></span>`}${!ok&&it.x&&it.o&&it.x[it.o.indexOf(mine)]?`<span class="whyx"><b>Nega “${mine}” mos emas:</b> ${it.x[it.o.indexOf(mine)]}</span>`:""}<span>${ok?"":"<b class=\"whyr\">Nega to'g'ri javob shunday:</b> "}${why||""}</span>${brk(it,ok,right,mine)}${ruleBox(it)}${!ok&&byId[it.les]&&opt.link?`<a href="#dars-${it.les}">Dars: ${byId[it.les].t}</a>`:""}</div><button class="btn pri" id="nx" type="button">${i+1<its.length?"Keyingi savol":"Natijani ko'rish"}</button>`;

    }else if(it.t==="tr"){
      h+=`<p class="qq">${it.q}</p><p class="fm-ex">${it.src}</p><form class="inrow" id="inf"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Javob"><button class="btn pri">Tekshirish</button></form>`;

const valid=k=>{const j=k.lastIndexOf(":"),L=byId[k.slice(0,j)];return L&&L.ex[+k.slice(j+1)]};

function diktant(){
