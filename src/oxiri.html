<!-- eduhakimov-himoya -->
<style>
.eh-mualliflik{position:fixed;left:8px;bottom:6px;z-index:2147483000;font:11px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#fff;background:rgba(20,22,26,.55);padding:3px 8px;border-radius:999px;text-decoration:none;opacity:.7;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.eh-mualliflik:hover,.eh-mualliflik:focus{opacity:1;text-decoration:underline}
.eh-ogoh{position:fixed;inset:0;z-index:2147483646;background:#141517;color:#e8e8e6;display:flex;align-items:center;
  justify-content:center;text-align:center;padding:24px;font:16px/1.6 system-ui,sans-serif}
.eh-ogoh a{color:#7fb2f0}
@media print{body>*{display:none!important}body:after{content:"Bu material mualliflik huquqi bilan himoyalangan. Chop etish taqiqlangan.";display:block;padding:40px;font:16px sans-serif}}
</style>
<script>
(function () {
  var NOM = "Grammatika Metro", ASL = "https://eduhakimov.github.io/grammatika-metro/", MUALLIF = "Hakimov Bahtiyorjon Muzaffar o'g'li";
  var host = location.hostname;
  var ruxsat = host === "eduhakimov.github.io" || host === "localhost" || host === "127.0.0.1";
  try { if (window.top !== window.self) { window.top.location = window.self.location.href; } } catch (e) { }
  function maydon(t) { return t && t.closest && t.closest("input,textarea,select,[contenteditable]"); }
  document.addEventListener("contextmenu", function (e) { if (!maydon(e.target)) { e.preventDefault(); } });
  ["copy", "cut"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { if (!maydon(e.target)) { e.preventDefault(); } });
  });
  document.addEventListener("keydown", function (e) {
    var k = (e.key || "").toLowerCase(), c = e.ctrlKey || e.metaKey;
    if ((c && (k === "s" || k === "u" || k === "p")) || (c && e.shiftKey && (k === "i" || k === "j"))) {
      e.preventDefault();
    }
  }, true);
  // saytdan tashqariga olib boradigan havolalar yangi oynada ochiladi (rel="noopener")
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a) { return; }
    var u;
    try { u = new URL(a.getAttribute("href"), location.href); } catch (x) { return; }
    if ((u.protocol === "http:" || u.protocol === "https:") &&
        u.hostname !== "eduhakimov.github.io" && u.hostname !== location.hostname) {
      a.target = "_blank";
      if (!/(^|\s)noopener(\s|$)/.test(a.rel || "")) { a.rel = ((a.rel || "") + " noopener").trim(); }
    }
  }, true);
  function qur() {
    if (!ruxsat) {
      var w = document.createElement("div");
      w.className = "eh-ogoh";
      w.innerHTML = "<div><b>Bu nusxa ruxsatsiz ko'chirilgan.</b><br>\u201c" + NOM +
        "\u201d mualliflik huquqi bilan himoyalangan.<br>Muallif: " + MUALLIF +
        "<br><br>Asl manba: <a href='" + ASL + "'>" + ASL + "</a></div>";
      document.body.appendChild(w);
      return;
    }
    var a = document.createElement("a");
    a.className = "eh-mualliflik";
    a.href = "https://eduhakimov.github.io/";
    a.title = "Muallif: " + MUALLIF + ". Barcha huquqlar himoyalangan. Bosh sahifaga qaytish: eduhakimov.github.io";
    a.textContent = "\u00a9 2026 Hakimov B.M. \u00b7 Bosh sahifa";
    document.body.appendChild(a);
    kot();
    window.addEventListener("resize", kot);
    setInterval(kot, 1500);
  }
  // pastda qotirilgan menyu bo'lsa, yozuvlar uning ustiga ko'tariladi (tugmalarni to'smasin)
  function kot() {
    var h = 0, H = window.innerHeight;
    [[0.2, 3], [0.5, 3], [0.8, 3], [0.2, 24], [0.5, 24], [0.8, 24], [0.5, 44]].forEach(function (f) {
      var els = document.elementsFromPoint ? document.elementsFromPoint(window.innerWidth * f[0], H - f[1]) : [];
      for (var i = 0; i < els.length; i++) {
        var n = els[i];
        if (/eh-mualliflik|eh-manba|lsn-manba/.test(n.getAttribute("class") || "")) { continue; }
        while (n && n !== document.body && n !== document.documentElement) {
          var p = getComputedStyle(n).position;
          if (p === "fixed" || p === "sticky") {
            var r = n.getBoundingClientRect();
            if (r.height < H * 0.4 && r.bottom >= H - 60) { h = Math.max(h, H - r.top); }
            break;
          }
          n = n.parentElement;
        }
      }
    });
    var b = document.querySelectorAll(".eh-mualliflik,.eh-manba,.lsn-manba");
    for (var j = 0; j < b.length; j++) { b[j].style.bottom = (h + 6) + "px"; }
  }
  if (document.body) { qur(); } else { document.addEventListener("DOMContentLoaded", qur); }
})();
</script>
</body>
</html>
